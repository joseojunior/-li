services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lilibag}
      POSTGRES_USER: ${POSTGRES_USER:-lilibag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env.production}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: ..
      target: api
    command: node apps/api/dist/db/migrate.js
    env_file: ${LILIBAG_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ..
      target: api
    restart: unless-stopped
    env_file: ${LILIBAG_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["3000"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [internal]

  worker:
    build:
      context: ..
      target: worker
    restart: unless-stopped
    env_file: ${LILIBAG_ENV_FILE:-.env.production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [internal]

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    env_file: ${LILIBAG_ENV_FILE:-.env.production}
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
