services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lilibag
      POSTGRES_USER: lilibag
      POSTGRES_PASSWORD: lilibag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilibag -d lilibag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ["media"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lilibag
      MINIO_ROOT_PASSWORD: change-this-before-use
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
